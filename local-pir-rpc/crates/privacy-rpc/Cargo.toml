[package]
name = "kohaku-privacy-rpc"
version = "0.1.0"
edition = "2024"
description = "Batch-aware Tor + PIR privacy orchestrator for Alloy JSON-RPC"

[lib]
crate-type = ["rlib"]

[dependencies]
alloy = { workspace = true, features = [
    "rpc",
    "rpc-types",
    "json-rpc",
    "network",
    "providers",
    "transports",
    "sol-types",
] }
async-trait = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
kohaku-pir-rpc = { workspace = true }
kohaku-tor-rpc = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tracing = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
