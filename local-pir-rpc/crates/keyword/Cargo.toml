[package]
name = "pir-keyword"
version = "0.1.0"
edition = "2021"
description = "Keyword-PIR layer: capacity-2 cuckoo hashing, 15-bit slot packing for the inspire-gpu backend, and the service manifest / sidecar-broadcast wire types"

[dependencies]
sha3 = "0.11"
siphasher = "1"
hex = "0.4"
fastrand = "2.0"
rayon = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
