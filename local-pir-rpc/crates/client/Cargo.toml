[package]
name = "pir-client"
version = "0.1.0"
edition = "2021"
description = "Client for the PIR serving front: single-round private lookups (one POST carrying the cuckoo bucket-pair queries); library + CLI. No GPU needed."

[dependencies]
pir-backend-ffi = { path = "../backend-ffi" }
pir-keyword = { path = "../keyword" }
ureq = { version = "3.3", default-features = false, features = ["rustls", "json"] }
serde_json = "1.0"
hex = "0.4"
clap = { version = "4.5", features = ["derive"] }

[[bin]]
name = "pir-client"
path = "src/main.rs"
